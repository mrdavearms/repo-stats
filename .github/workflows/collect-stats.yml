name: Collect Repo Stats

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily (16:00 AEST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for what counts as a real "download" (a human
      # installing the app). Matches installer/package assets by extension,
      # case-insensitively. Auto-updater manifests (latest.json / latest*.yml),
      # detached signatures (.sig), electron diff blockmaps (.blockmap) and the
      # Tauri/electron update bundles (.tar.gz) are deliberately NOT installers —
      # they are fetched automatically and must not inflate the count.
      # NOTE: .zip is assumed to be an app package; a sample-data .zip attached to
      # a release would be counted (acceptable — see CLAUDE.md "Download counting").
      INSTALLER_REGEX: '\.(dmg|exe|msi|pkg|appimage|deb|rpm|zip)$'
      # Auto-updater manifests: electron-updater's latest.yml / latest-mac.yml and
      # Tauri's latest.json. Every installed copy fetches one of these when it
      # checks for a new version, so their download_count is a rough measure of
      # the ACTIVE INSTALLED BASE ("update checks"), tracked separately.
      UPDATER_REGEX: '^latest(-[a-z0-9]+)?\.(yml|json)$'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Collect traffic and release data
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          set -euo pipefail

          # naplan-cohort-tracker stages builds as DRAFT releases and mirrors the
          # public downloads to naplan-cohort-tracker-releases (which also serves the
          # Pages install page). So the source repo supplies traffic/stars and the
          # mirror supplies the real download numbers — both are tracked.
          REPOS=("mrdavearms/bulk-pdf-extractor-and-generator" "mrdavearms/student-doc-redactor" "mrdavearms/naplan-cohort-tracker" "mrdavearms/naplan-cohort-tracker-releases")
          TODAY=$(date -u +%Y-%m-%d)

          TRAFFIC_FILE="data/traffic.json"
          RELEASES_FILE="data/releases.json"

          # Fetch a GitHub API URL, retrying transient failures (5xx / network) with
          # backoff. Echoes the response body and returns 0 on success; returns 1 if
          # every attempt fails.
          #
          # Callers MUST check the return code and skip writing that day's data point
          # rather than substituting an empty body. A silent `|| echo '[]'` fallback
          # records a transient GitHub outage as a genuine ZERO — that is how a real
          # outage on 2026-07-20 wrote "0 downloads" over the true figure. Absence of
          # data is not zero: skipping leaves the previous point intact and the next
          # run fills the gap.
          # Every fetch failure is also recorded here; the email step turns the list
          # into a "data incomplete" banner so a silent gap is never mistaken for zero.
          warn() { echo "$1" >> /tmp/collect_warnings.txt; echo "    WARNING: $1"; }

          gh_fetch() {
            local url="$1" accept="${2:-application/vnd.github+json}" body attempt
            for attempt in 1 2 3 4 5; do
              if body=$(curl -sf --max-time 30 \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: $accept" "$url"); then
                printf '%s' "$body"
                return 0
              fi
              [ "$attempt" -lt 5 ] && sleep $(( attempt * 4 ))
            done
            return 1
          }

          # Initialize files if empty or missing
          if [ ! -s "$TRAFFIC_FILE" ]; then
            echo '{}' > "$TRAFFIC_FILE"
          fi
          if [ ! -s "$RELEASES_FILE" ]; then
            echo '{}' > "$RELEASES_FILE"
          fi

          for FULL_REPO in "${REPOS[@]}"; do
            REPO_NAME=$(echo "$FULL_REPO" | cut -d'/' -f2)
            echo "=== Collecting data for $REPO_NAME ==="

            # Per-repo fetch status. Anything that fails after retries leaves its
            # *_OK flag at 0, and the corresponding write below is skipped so a
            # transient outage never overwrites a real figure with a zero.
            REPO_FETCH_FAILED=0

            # --- Traffic: Views ---
            echo "  Fetching views..."
            VIEWS_OK=1
            VIEWS=$(gh_fetch "https://api.github.com/repos/${FULL_REPO}/traffic/views") \
              || { VIEWS_OK=0; REPO_FETCH_FAILED=1; VIEWS='{"views":[]}'; warn "$REPO_NAME: views fetch failed"; }

            # --- Traffic: Clones ---
            echo "  Fetching clones..."
            CLONES_OK=1
            CLONES=$(gh_fetch "https://api.github.com/repos/${FULL_REPO}/traffic/clones") \
              || { CLONES_OK=0; REPO_FETCH_FAILED=1; CLONES='{"clones":[]}'; warn "$REPO_NAME: clones fetch failed"; }

            # --- Traffic: Referrers ---
            echo "  Fetching referrers..."
            REFS_OK=1
            REFERRERS=$(gh_fetch "https://api.github.com/repos/${FULL_REPO}/traffic/popular/referrers") \
              || { REFS_OK=0; REPO_FETCH_FAILED=1; REFERRERS='[]'; warn "$REPO_NAME: referrers fetch failed"; }

            # --- Traffic: Popular Paths ---
            echo "  Fetching popular paths..."
            PATHS_OK=1
            PATHS=$(gh_fetch "https://api.github.com/repos/${FULL_REPO}/traffic/popular/paths") \
              || { PATHS_OK=0; REPO_FETCH_FAILED=1; PATHS='[]'; warn "$REPO_NAME: paths fetch failed"; }

            # --- Repo meta: stars, forks, watchers (subscribers) ---
            # One call to the repo object gives all three engagement counters.
            # NOTE: the API's "watchers_count" is a legacy alias of stars; the real
            # "Watch" count is "subscribers_count".
            echo "  Fetching repo meta (stars/forks/watchers)..."
            META_OK=1
            REPO_JSON=$(gh_fetch "https://api.github.com/repos/${FULL_REPO}") \
              || { META_OK=0; REPO_FETCH_FAILED=1; REPO_JSON='{}'; warn "$REPO_NAME: repo meta fetch failed"; }
            STARS=$(echo "$REPO_JSON" | jq '.stargazers_count // 0')
            FORKS=$(echo "$REPO_JSON" | jq '.forks_count // 0')
            WATCHERS=$(echo "$REPO_JSON" | jq '.subscribers_count // 0')

            # --- Star events (when each user starred) ---
            # The star+json media type adds a "starred_at" timestamp per stargazer.
            # One page of 100 is plenty for these low-star repos.
            echo "  Fetching stargazers (with timestamps)..."
            STARGAZERS=$(gh_fetch "https://api.github.com/repos/${FULL_REPO}/stargazers?per_page=100" \
                  "application/vnd.github.star+json") \
              || { REPO_FETCH_FAILED=1; STARGAZERS='[]'; warn "$REPO_NAME: stargazers fetch failed"; }

            # --- Merge views into traffic.json ---
            EXISTING=$(cat "$TRAFFIC_FILE")
            EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" '
              if .[$repo] == null then
                .[$repo] = {"views":[],"clones":[],"referrers":[],"popular_paths":[],"stars":[],"forks":[],"watchers":[],"star_events":[]}
              else
                .[$repo].stars = (.[$repo].stars // [])
                | .[$repo].forks = (.[$repo].forks // [])
                | .[$repo].watchers = (.[$repo].watchers // [])
                | .[$repo].star_events = (.[$repo].star_events // [])
              end
            ')

            # Merge daily views (deduplicate by date, keep latest)
            EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --argjson new_views "$VIEWS" '
              .[$repo].views = (
                [.[$repo].views[], ($new_views.views // [] | .[] | {
                  date: (.timestamp | split("T")[0]),
                  total: .count,
                  unique: .uniques
                })]
                | group_by(.date)
                | map(last)
                | sort_by(.date)
              )
            ')

            # Merge daily clones (deduplicate by date, keep latest)
            EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --argjson new_clones "$CLONES" '
              .[$repo].clones = (
                [.[$repo].clones[], ($new_clones.clones // [] | .[] | {
                  date: (.timestamp | split("T")[0]),
                  total: .count,
                  unique: .uniques
                })]
                | group_by(.date)
                | map(last)
                | sort_by(.date)
              )
            ')

            # Store today's referrer snapshot (replace if same date).
            # Skipped on fetch failure: writing an empty snapshot would erase a real
            # one already collected today and report "no sources" on the dashboard.
            if [ "$REFS_OK" -eq 1 ]; then
              EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --arg today "$TODAY" --argjson refs "$REFERRERS" '
                .[$repo].referrers = (
                  [(.[$repo].referrers // [] | .[] | select(.date != $today)),
                   {date: $today, sources: ($refs | map({referrer, count: (.count // 0), unique: (.uniques // 0)}))}]
                  | sort_by(.date)
                )
              ')
            fi

            # Store today's popular paths snapshot (replace if same date)
            if [ "$PATHS_OK" -eq 1 ]; then
              EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --arg today "$TODAY" --argjson paths "$PATHS" '
                .[$repo].popular_paths = (
                  [(.[$repo].popular_paths // [] | .[] | select(.date != $today)),
                   {date: $today, paths: ($paths | map({path, count: .count, unique: .uniques}))}]
                  | sort_by(.date)
                )
              ')
            fi

            # Store today's star / fork / watcher counts (replace if same date).
            # All three come from the one repo-meta call, so they share META_OK.
            # On failure we skip rather than record 0 — a zero here would look like
            # everyone unstarred the repo overnight.
            if [ "$META_OK" -eq 1 ]; then
              EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --arg today "$TODAY" --argjson stars "$STARS" '
                .[$repo].stars = (
                  [(.[$repo].stars // [] | .[] | select(.date != $today)),
                   {date: $today, count: $stars}]
                  | sort_by(.date)
                )
              ')

              EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --arg today "$TODAY" --argjson forks "$FORKS" '
                .[$repo].forks = (
                  [(.[$repo].forks // [] | .[] | select(.date != $today)),
                   {date: $today, count: $forks}]
                  | sort_by(.date)
                )
              ')

              EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --arg today "$TODAY" --argjson watchers "$WATCHERS" '
                .[$repo].watchers = (
                  [(.[$repo].watchers // [] | .[] | select(.date != $today)),
                   {date: $today, count: $watchers}]
                  | sort_by(.date)
                )
              ')
            fi

            # Merge star events (one row per stargazer: when they starred + who).
            # Dedup by login (keep latest seen), so re-runs never duplicate. Stargazers
            # of a public repo are already public, so storing the login is not a leak.
            EXISTING=$(echo "$EXISTING" | jq --arg repo "$REPO_NAME" --argjson sg "$STARGAZERS" '
              .[$repo].star_events = (
                ([.[$repo].star_events // [] | .[]]
                 + [$sg | if type == "array" then .[] else empty end
                      | select(.starred_at != null)
                      | {date: (.starred_at | split("T")[0]), login: (.user.login // "")}])
                | group_by(.login)
                | map(last)
                | sort_by(.date)
              )
            ')

            echo "$EXISTING" > "$TRAFFIC_FILE"

            # --- Releases ---
            echo "  Fetching releases..."
            RELEASES_OK=1
            RELEASES=$(gh_fetch "https://api.github.com/repos/${FULL_REPO}/releases") \
              || { RELEASES_OK=0; REPO_FETCH_FAILED=1; RELEASES='[]'; warn "$REPO_NAME: releases fetch failed"; }

            EXISTING_REL=$(cat "$RELEASES_FILE")
            if ! echo "$EXISTING_REL" | jq -e --arg repo "$REPO_NAME" '.[$repo]' > /dev/null 2>&1; then
              EXISTING_REL=$(echo "$EXISTING_REL" | jq --arg repo "$REPO_NAME" '.[$repo] = {"releases":[],"history":[]}')
            fi

            # Build current release snapshot.
            # DRAFT releases are excluded: their assets are only reachable by users
            # with push access, so their download_count reflects the maintainer/CI,
            # never the public. Counting them reports phantom installs (this bit us
            # on naplan-cohort-tracker, which stages every build as a draft and
            # publishes via a separate mirror repo).
            # Each asset is classified once here (installer / updater / platform) so
            # the dashboard and the email never need their own copy of the regexes.
            RELEASE_DATA=$(echo "$RELEASES" | jq --arg re "$INSTALLER_REGEX" --arg upd "$UPDATER_REGEX" '[.[] | select(.draft | not) | {
              tag: .tag_name,
              name: .name,
              published_at: .published_at,
              assets: [.assets[] | (.name // "") as $n | {
                name: .name,
                download_count: .download_count,
                size_bytes: .size,
                installer: ($n | test($re; "i")),
                updater: ($n | test($upd; "i")),
                platform: (if ($n | test("\\.(exe|msi)$"; "i")) then "windows"
                           elif ($n | test("\\.(dmg|pkg)$"; "i")) or ($n | test("mac"; "i")) then "mac"
                           elif ($n | test("\\.(appimage|deb|rpm)$"; "i")) then "linux"
                           else "other" end)
              }]
            }]')

            # Total installer downloads across all releases (what a person clicking
            # "download" produces), and total update checks (installed copies
            # asking whether a newer version exists).
            TOTAL_DL=$(echo "$RELEASE_DATA" | jq '[.[].assets[] | select(.installer) | .download_count] | add // 0')
            UPDATE_CHECKS=$(echo "$RELEASE_DATA" | jq '[.[].assets[] | select(.updater) | .download_count] | add // 0')

            # Update releases and history.
            # Skipped entirely when the releases fetch failed: download_count is a
            # cumulative all-time counter, so writing 0 from an empty response both
            # destroys today's true figure and shows a large negative delta in the
            # email. Leaving the point unwritten is always the safer failure mode.
            if [ "$RELEASES_OK" -eq 1 ]; then
              EXISTING_REL=$(echo "$EXISTING_REL" | jq \
                --arg repo "$REPO_NAME" \
                --argjson rel "$RELEASE_DATA" \
                --argjson total "$TOTAL_DL" \
                --argjson checks "$UPDATE_CHECKS" \
                --arg today "$TODAY" '
                .[$repo].releases = $rel |
                .[$repo].history = (
                  [(.[$repo].history // [] | .[] | select(.date != $today)),
                   {date: $today, total_downloads: $total, update_checks: $checks}]
                  | sort_by(.date)
                ) |
                .[$repo].asset_history = (
                  [(.[$repo].asset_history // [] | .[] | select(.date != $today)),
                   {date: $today, assets: [$rel[] | .tag as $t | .assets[]
                      | select(.installer)
                      | {tag: $t, name, platform, download_count}]}]
                  | sort_by(.date)
                )
              ')

              echo "$EXISTING_REL" > "$RELEASES_FILE"
            else
              echo "    SKIPPED release history write (fetch failed; previous data kept)"
            fi

            if [ "$REPO_FETCH_FAILED" -eq 1 ]; then
              echo "  NOTE: $REPO_NAME had at least one failed fetch; affected data points were skipped, not zeroed."
            fi

            echo "  Done with $REPO_NAME"
          done

          # Pretty-print the JSON files
          jq '.' "$TRAFFIC_FILE" > tmp.json && mv tmp.json "$TRAFFIC_FILE"
          jq '.' "$RELEASES_FILE" > tmp.json && mv tmp.json "$RELEASES_FILE"

          echo "=== Collection complete ==="

      - name: Check token expiry
        id: token_check
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          # Make an API call and capture the token expiry header
          EXPIRY_HEADER=$(curl -sI -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/rate_limit" | grep -i "github-authentication-token-expiration" | tr -d '\r')

          if [ -n "$EXPIRY_HEADER" ]; then
            # Header format: github-authentication-token-expiration: 2027-03-18 06:00:00 UTC
            EXPIRY_DATE=$(echo "$EXPIRY_HEADER" | sed 's/.*: //' | cut -d' ' -f1)
            TODAY=$(date -u +%Y-%m-%d)
            EXPIRY_EPOCH=$(date -d "$EXPIRY_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%d" "$EXPIRY_DATE" +%s 2>/dev/null || echo "0")
            TODAY_EPOCH=$(date -u +%s)
            DAYS_LEFT=$(( (EXPIRY_EPOCH - TODAY_EPOCH) / 86400 ))

            echo "Token expires: $EXPIRY_DATE ($DAYS_LEFT days remaining)"
            echo "days_left=$DAYS_LEFT" >> "$GITHUB_OUTPUT"
            echo "expiry_date=$EXPIRY_DATE" >> "$GITHUB_OUTPUT"

            if [ "$DAYS_LEFT" -le 30 ]; then
              echo "warning=true" >> "$GITHUB_OUTPUT"
            else
              echo "warning=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Could not determine token expiry (token may not have an expiration)"
            echo "days_left=-1" >> "$GITHUB_OUTPUT"
            echo "expiry_date=none" >> "$GITHUB_OUTPUT"
            echo "warning=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update stats data for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send daily email summary
        if: env.GMAIL_ADDRESS != '' && env.GMAIL_APP_PASSWORD != ''
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          TOKEN_DAYS_LEFT: ${{ steps.token_check.outputs.days_left }}
          TOKEN_EXPIRY_DATE: ${{ steps.token_check.outputs.expiry_date }}
          TOKEN_WARNING: ${{ steps.token_check.outputs.warning }}
        run: |
          set -u
          TODAY=$(date -u +%Y-%m-%d)
          DISPLAY_DATE=$(date -u +"%d %b %Y")
          YESTERDAY=$(date -u -d "1 day ago" +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
          WEEK_AGO=$(date -u -d "7 days ago" +%Y-%m-%d 2>/dev/null || date -u -v-7d +%Y-%m-%d)
          TWO_WEEKS_AGO=$(date -u -d "14 days ago" +%Y-%m-%d 2>/dev/null || date -u -v-14d +%Y-%m-%d)
          STALE_CUTOFF=$(date -u -d "4 days ago" +%Y-%m-%d 2>/dev/null || date -u -v-4d +%Y-%m-%d)
          T=data/traffic.json
          R=data/releases.json

          # One email card per APP. NAPLAN is two repos by design (source repo for
          # traffic/stars, releases mirror for downloads), so it is one card fed by both.
          APPS=("Bulk PDF Extractor|bulk-pdf-extractor-and-generator|bulk-pdf-extractor-and-generator"
                "Student Doc Redactor|student-doc-redactor|student-doc-redactor"
                "NAPLAN Cohort Tracker|naplan-cohort-tracker|naplan-cohort-tracker-releases")

          # "22 Sep" from "2026-09-22" (GNU date on the runner, BSD fallback for local tests)
          short_date() { date -u -d "$1" +"%-d %b" 2>/dev/null || date -u -j -f "%Y-%m-%d" "$1" +"%-d %b" 2>/dev/null || echo "$1"; }

          # Coloured up/down trend span from this-week vs last-week view totals (empty if no prior week).
          trend_html() {
            local this_week="$1" last_week="$2" pct
            if [ "$last_week" -gt 0 ] 2>/dev/null; then
              pct=$(( (this_week - last_week) * 100 / last_week ))
              if [ "$pct" -ge 0 ]; then
                printf '<span style="color:#3fb950;">&#9650; +%s%%</span> views vs last week' "$pct"
              else
                printf '<span style="color:#f85149;">&#9660; %s%%</span> views vs last week' "$pct"
              fi
            fi
          }

          # Coloured change in the all-time download total since the previous snapshot.
          # A jump of 15+ in one day is far above these repos' normal 1-2/day and has
          # always turned out to be a crawler sweeping the installers (e.g. 27 May 2026:
          # +92 on one Mac .dmg), so it is flagged rather than celebrated. A negative
          # change means GitHub revised its own counter down, not lost downloads.
          dl_delta_html() {
            local delta="$1"
            if [ "$delta" -ge 15 ] 2>/dev/null; then
              printf '<span style="color:#f0883e;">&#9650; +%s yesterday &mdash; unusually large, likely a crawler</span>' "$delta"
            elif [ "$delta" -gt 0 ] 2>/dev/null; then
              printf '<span style="color:#3fb950;">&#9650; +%s yesterday</span>' "$delta"
            elif [ "$delta" -lt 0 ] 2>/dev/null; then
              printf '<span style="color:#8b949e;">GitHub revised the total down by %s</span>' "${delta#-}"
            else
              printf '<span style="color:#8b949e;">none yesterday</span>'
            fi
          }

          # Latest COMPLETE day of a daily {date,total,unique} series. GitHub's traffic
          # feed lags 1-2 days, so "yesterday" is often not there yet; showing the
          # missing day as 0 would be wrong (absence is not zero). Returns JSON.
          latest_day() {
            jq -c --arg r "$1" --arg k "$2" --arg t "$TODAY" \
              '[.[$r][$k][]? | select(.date < $t)] | last // {date:"",total:0,unique:0}' "$T"
          }

          # Sum of a field over a date window [from, to) of a daily series.
          sum_window() {
            jq -r --arg r "$1" --arg k "$2" --arg f "$3" --arg from "$4" --arg to "$5" \
              '[.[$r][$k][]? | select(.date >= $from and .date < $to) | .[$f]] | add // 0' "$T"
          }

          # New installer downloads between the latest per-asset snapshot and the latest
          # snapshot on or before $2, split by platform and listed per version. Snapshots
          # written before 2026-09-22 have no release tag, so those are matched by file
          # name only. Returns JSON {from,total,win,mac,other,detail}.
          asset_window() {
            jq -c --arg r "$1" --arg cut "$2" '
              (.[$r].asset_history // []) as $h
              | ($h | last) as $cur
              | ([$h[] | select(.date <= $cut and .date < ($cur.date // ""))] | last) as $prev
              | ($prev != null and ($prev.assets | any(.tag == null))) as $notag
              | if $cur == null or $prev == null
                   or ($notag and (($prev.assets | map(.name) | unique | length) < ($prev.assets | length)))
                then {from:"",total:0,win:0,mac:0,other:0,detail:""} else
                  def k: (if $notag then "" else (.tag // "") end) + "|" + .name;
                    def plat: (.platform // (if (.name | test("\\.(exe|msi)$"; "i")) then "windows"
                                             elif (.name | test("\\.(dmg|pkg)$"; "i")) or (.name | test("mac"; "i")) then "mac"
                                             else "other" end));
                    ($prev.assets | map({key: k, value: .download_count}) | from_entries) as $p
                  | [$cur.assets[] | {tag: (.tag // "?"), platform: plat, d: (.download_count - ($p[k] // 0))} | select(.d > 0)] as $rows
                  | { from: $prev.date,
                      total: ([$rows[].d] | add // 0),
                      win: ([$rows[] | select(.platform == "windows") | .d] | add // 0),
                      mac: ([$rows[] | select(.platform == "mac") | .d] | add // 0),
                      other: ([$rows[] | select(.platform != "windows" and .platform != "mac") | .d] | add // 0),
                      detail: ($rows | group_by(.tag + .platform)
                                | map({tag: .[0].tag, platform: .[0].platform, d: ([.[].d] | add)})
                                | sort_by(-.d) | .[:5]
                                | map("\(.tag) \(.platform | if . == "windows" then "Windows" elif . == "mac" then "Mac" else . end) &times;\(.d)")
                                | join(", ")) }
                end' "$R"
          }

          # Change in the all-time installer total over the same window (used when the
          # per-asset snapshots cannot supply a platform split). Empty if no baseline.
          hist_window() {
            jq -r --arg r "$1" --arg cut "$2" '
              (.[$r].history // []) as $h | ($h | last) as $cur
              | ([$h[] | select(.date <= $cut and .date < ($cur.date // ""))] | last) as $prev
              | if $cur == null or $prev == null then "" else ($cur.total_downloads - $prev.total_downloads) end' "$R"
          }

          # Change in update checks between the latest history point and the latest on
          # or before $2. Empty string when either side predates the field.
          checks_window() {
            jq -r --arg r "$1" --arg cut "$2" '
              (.[$r].history // []) as $h | ($h | last) as $cur
              | ([$h[] | select(.date <= $cut and .date < ($cur.date // ""))] | last) as $prev
              | if ($cur.update_checks // null) == null or ($prev.update_checks // null) == null then ""
                else ($cur.update_checks - $prev.update_checks) end' "$R"
          }

          # "name count (unique unique) · ..." from the latest 14-day referrer / path snapshot.
          # $1 = field (referrer|path), $2 = JSON array, $3 = how many. Repo paths are
          # shortened to what follows the repo name ("/" is the repo home page).
          top_line() {
            echo "$2" | jq -r --arg k "$1" --argjson n "$3" '
              if (type == "array" and length > 0) then
                (sort_by(-(.count // 0))[:$n]
                 | map((.[$k] | if $k == "path" then (sub("^/mrdavearms/[^/]+"; "") | if . == "" then "home" else . end) else . end)
                       + " " + ((.count // 0) | tostring)
                       + (if (.unique // 0) > 0 then " (" + (.unique | tostring) + " unique)" else "" end))
                 | join(" &middot; "))
              else "&mdash;" end' 2>/dev/null || echo "&mdash;"
          }

          # Warnings the collect step left behind (fetch failures) plus stale traffic feeds.
          WARN_ITEMS=""
          if [ -s /tmp/collect_warnings.txt ]; then
            WARN_ITEMS=$(sed 's/&/\&amp;/g; s/</\&lt;/g' /tmp/collect_warnings.txt | paste -sd'|' - | sed 's/|/<br>/g')
          fi

          # Cross-app totals for the header and the subject line.
          Y_TOTAL=0; Y_WIN=0; Y_MAC=0; W_TOTAL=0; W_WIN=0; W_MAC=0; W_CHECKS=0; W_CHECKS_KNOWN=0; FLAGGED=0; Y_IS_YESTERDAY=1

          APP_CARDS=""
          for APP in "${APPS[@]}"; do
            LABEL=${APP%%|*}; REST=${APP#*|}; TR=${REST%%|*}; DR=${REST#*|}

            # --- Traffic (from the source repo) ---
            V=$(latest_day "$TR" views);  V_DATE=$(echo "$V" | jq -r .date); V_N=$(echo "$V" | jq -r .total); V_U=$(echo "$V" | jq -r .unique)
            C=$(latest_day "$TR" clones); C_DATE=$(echo "$C" | jq -r .date); C_N=$(echo "$C" | jq -r .total); C_U=$(echo "$C" | jq -r .unique)
            if [ -n "$V_DATE" ]; then V_LABEL="Views ($(short_date "$V_DATE"))"; else V_LABEL="Views (no data)"; fi
            if [ -n "$C_DATE" ]; then C_LABEL="Clones ($(short_date "$C_DATE"))"; else C_LABEL="Clones (no data)"; fi
            if [ -n "$V_DATE" ] && [ "$V_DATE" \< "$STALE_CUTOFF" ]; then
              WARN_ITEMS="${WARN_ITEMS:+${WARN_ITEMS}<br>}${LABEL}: newest page-view day is ${V_DATE} (GitHub normally lags 1&ndash;2 days; check the Action if this persists)"
            fi

            VIEWS_7D=$(sum_window "$TR" views total "$WEEK_AGO" "$TODAY")
            VIEWS_7D_U=$(sum_window "$TR" views unique "$WEEK_AGO" "$TODAY")
            CLONES_7D=$(sum_window "$TR" clones total "$WEEK_AGO" "$TODAY")
            CLONES_7D_U=$(sum_window "$TR" clones unique "$WEEK_AGO" "$TODAY")
            LAST_WEEK=$(sum_window "$TR" views total "$TWO_WEEKS_AGO" "$WEEK_AGO")
            TOTAL_VIEWS=$(jq -r --arg r "$TR" '[.[$r].views[]?.total] | add // 0' "$T")
            TOTAL_UNIQUE=$(jq -r --arg r "$TR" '[.[$r].views[]?.unique] | add // 0' "$T")
            STAR_COUNT=$(jq -r --arg r "$TR" '(.[$r].stars | last | .count) // 0' "$T")
            FORK_COUNT=$(jq -r --arg r "$TR" '(.[$r].forks | last | .count) // 0' "$T")
            WATCH_COUNT=$(jq -r --arg r "$TR" '(.[$r].watchers | last | .count) // 0' "$T")

            REFS_JSON=$(jq -c --arg r "$TR" '((.[$r].referrers // []) | last | .sources?) // []' "$T")
            PATHS_JSON=$(jq -c --arg r "$TR" '((.[$r].popular_paths // []) | last | .paths?) // []' "$T")
            REF_LINE=$(top_line referrer "$REFS_JSON" 5)
            PATH_LINE=$(top_line path "$PATHS_JSON" 4)
            # Visits to the Releases pages = people who went looking for the download.
            REL_PAGES=$(echo "$PATHS_JSON" | jq -r '[.[] | select(.path | test("/releases"))] | "\([.[].count] | add // 0) views, \([.[].unique] | add // 0) unique"')

            # --- Downloads (from the releases repo) ---
            DL=$(jq -r --arg r "$DR" '(.[$r].history | last | .total_downloads) // 0' "$R")
            DL_DELTA=$(jq -r --arg r "$DR" '(.[$r].history // []) as $h | if ($h | length) >= 2 then ($h[-1].total_downloads - $h[-2].total_downloads) else 0 end' "$R")
            PLAT=$(jq -c --arg r "$DR" --arg re "$INSTALLER_REGEX" --arg upd "$UPDATER_REGEX" '
              def inst: (.installer // (.name | test($re; "i")));
              def isupd: (.updater // (.name | test($upd; "i")));
              def plat: (.platform // (if (.name | test("\\.(exe|msi)$"; "i")) then "windows"
                                       elif (.name | test("\\.(dmg|pkg)$"; "i")) or (.name | test("mac"; "i")) then "mac"
                                       else "other" end));
              [.[$r].releases[]?.assets[]?] as $a
              | { win: ([$a[] | select(inst) | select(plat == "windows") | .download_count] | add // 0),
                  mac: ([$a[] | select(inst) | select(plat == "mac") | .download_count] | add // 0),
                  checks: ([$a[] | select(isupd) | .download_count] | add // 0),
                  has_updater: ([$a[] | select(isupd)] | length > 0) }' "$R")
            ALL_WIN=$(echo "$PLAT" | jq -r .win); ALL_MAC=$(echo "$PLAT" | jq -r .mac); ALL_CHECKS=$(echo "$PLAT" | jq -r .checks)
            # An app whose releases carry no updater manifest (Bulk PDF checks for
            # updates with a HEAD request to the releases page, which GitHub does not
            # count anywhere) has NO measurable update checks. Say so; never print 0.
            HAS_UPDATER=$(echo "$PLAT" | jq -r .has_updater)

            YD=$(asset_window "$DR" "$YESTERDAY")
            YD_FROM=$(echo "$YD" | jq -r .from); YD_N=$(echo "$YD" | jq -r .total); YD_WIN=$(echo "$YD" | jq -r .win); YD_MAC=$(echo "$YD" | jq -r .mac); YD_DETAIL=$(echo "$YD" | jq -r .detail)
            WK=$(asset_window "$DR" "$WEEK_AGO")
            WK_FROM=$(echo "$WK" | jq -r .from); WK_N=$(echo "$WK" | jq -r .total); WK_WIN=$(echo "$WK" | jq -r .win); WK_MAC=$(echo "$WK" | jq -r .mac); WK_DETAIL=$(echo "$WK" | jq -r .detail)
            YD_CHECKS=$(checks_window "$DR" "$YESTERDAY")
            WK_CHECKS=$(checks_window "$DR" "$WEEK_AGO")

            # No per-version baseline (older snapshots lack release tags): fall back to
            # the plain history total for the window, without a platform split.
            if [ -z "$YD_FROM" ]; then YD_N=$(hist_window "$DR" "$YESTERDAY"); YD_N=${YD_N:-0}; YD_WIN=0; YD_MAC=0; fi
            if [ -z "$WK_FROM" ]; then WK_N=$(hist_window "$DR" "$WEEK_AGO"); WK_N=${WK_N:-0}; WK_WIN=0; WK_MAC=0; fi
            [ "$YD_N" -lt 0 ] 2>/dev/null && YD_N=0
            [ "$WK_N" -lt 0 ] 2>/dev/null && WK_N=0

            Y_TOTAL=$((Y_TOTAL + YD_N)); Y_WIN=$((Y_WIN + YD_WIN)); Y_MAC=$((Y_MAC + YD_MAC))
            W_TOTAL=$((W_TOTAL + WK_N)); W_WIN=$((W_WIN + WK_WIN)); W_MAC=$((W_MAC + WK_MAC))
            if [ -n "$WK_CHECKS" ] && [ "$HAS_UPDATER" = "true" ]; then W_CHECKS=$((W_CHECKS + WK_CHECKS)); W_CHECKS_KNOWN=1; fi
            [ "$DL_DELTA" -ge 15 ] 2>/dev/null && FLAGGED=$((FLAGGED + 1))

            # Wording: "yesterday" only when the previous snapshot really is yesterday's.
            if [ "$YD_FROM" = "$YESTERDAY" ] || [ -z "$YD_FROM" ]; then YD_WHEN="yesterday"; else YD_WHEN="since $(short_date "$YD_FROM")"; Y_IS_YESTERDAY=0; fi
            if [ "$YD_N" -gt 0 ] 2>/dev/null; then
              if [ -n "$YD_FROM" ]; then
                YD_LINE="<strong style=\"color:#e6edf3;\">${YD_N} ${YD_WHEN}</strong> &middot; ${YD_DETAIL}"
              else
                YD_LINE="<strong style=\"color:#e6edf3;\">${YD_N} ${YD_WHEN}</strong> &middot; per-version split not available yet"
              fi
            else
              YD_LINE="none ${YD_WHEN}"
            fi
            if [ "$WK_N" -gt 0 ] 2>/dev/null; then
              if [ -n "$WK_FROM" ]; then
                WK_LINE="<strong style=\"color:#e6edf3;\">${WK_N}</strong> (Windows ${WK_WIN} &middot; Mac ${WK_MAC}) &middot; ${WK_DETAIL}"
              else
                WK_LINE="<strong style=\"color:#e6edf3;\">${WK_N}</strong> &middot; per-version split not available yet"
              fi
            else
              WK_LINE="none"
            fi
            if [ "$HAS_UPDATER" != "true" ]; then
              WK_CHECKS_TXT="update checks not measurable for this app"
              YD_CHECKS_TXT=""
              ALL_CHECKS_TXT="update checks not measurable (no updater file on its releases)"
            else
              if [ -n "$WK_CHECKS" ]; then WK_CHECKS_TXT="${WK_CHECKS} update checks"; else WK_CHECKS_TXT="update checks: not enough history yet"; fi
              if [ -n "$YD_CHECKS" ]; then YD_CHECKS_TXT=" &middot; ${YD_CHECKS} update checks"; else YD_CHECKS_TXT=""; fi
              ALL_CHECKS_TXT="${ALL_CHECKS} update checks"
            fi

            META="&#9733; ${STAR_COUNT} &middot; ${FORK_COUNT} forks &middot; ${WATCH_COUNT} watching"
            if [ "$TR" != "$DR" ]; then META="${META} &middot; downloads counted on ${DR}"; fi

            APP_CARDS="${APP_CARDS}
            <tr><td colspan=\"3\" style=\"padding:18px 0 8px 0;border-bottom:none;\">
              <strong style=\"font-size:16px;color:#e6edf3;\">${LABEL}</strong>
              <span style=\"color:#8b949e;font-size:12px;margin-left:8px;\">${META}</span>
            </td></tr>
            <tr style=\"background:#161b22;\">
              <td style=\"padding:10px 14px;border-radius:6px 0 0 0;\">
                <div style=\"color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;\">${V_LABEL}</div>
                <div style=\"font-size:22px;font-weight:700;color:#58a6ff;\">${V_N}</div>
                <div style=\"color:#8b949e;font-size:12px;\">${V_U} unique</div>
              </td>
              <td style=\"padding:10px 14px;\">
                <div style=\"color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;\">${C_LABEL}</div>
                <div style=\"font-size:22px;font-weight:700;color:#3fb950;\">${C_N}</div>
                <div style=\"color:#8b949e;font-size:12px;\">${C_U} unique</div>
              </td>
              <td style=\"padding:10px 14px;border-radius:0 6px 0 0;\">
                <div style=\"color:#8b949e;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;\">Downloads (all-time)</div>
                <div style=\"font-size:22px;font-weight:700;color:#d2a8ff;\">${DL}</div>
                <div style=\"color:#8b949e;font-size:12px;\">$(dl_delta_html "$DL_DELTA")</div>
              </td>
            </tr>
            <tr style=\"background:#161b22;\">
              <td colspan=\"3\" style=\"padding:4px 14px 10px;border-radius:0 0 6px 6px;color:#8b949e;font-size:12px;line-height:1.8;\">
                <span style=\"color:#6e7681;\">New downloads:</span> ${YD_LINE}${YD_CHECKS_TXT}<br>
                <span style=\"color:#6e7681;\">Last 7 days:</span> ${WK_LINE}<br>
                <span style=\"color:#6e7681;\">&nbsp;</span> ${WK_CHECKS_TXT} &middot; ${VIEWS_7D} views (${VIEWS_7D_U} unique) &middot; ${CLONES_7D} clones (${CLONES_7D_U} unique) &middot; $(trend_html "$VIEWS_7D" "$LAST_WEEK")<br>
                <span style=\"color:#6e7681;\">All-time:</span> ${DL} downloads (Windows ${ALL_WIN} &middot; Mac ${ALL_MAC}) &middot; ${ALL_CHECKS_TXT} &middot; ${TOTAL_VIEWS} views (${TOTAL_UNIQUE} unique)<br>
                <span style=\"color:#6e7681;\">Where visitors came from (14d):</span> ${REF_LINE}<br>
                <span style=\"color:#6e7681;\">Release pages (14d):</span> ${REL_PAGES} &middot; <span style=\"color:#6e7681;\">Top pages:</span> ${PATH_LINE}
              </td>
            </tr>"
          done

          # At-a-glance strip
          if [ "$FLAGGED" -gt 0 ]; then FLAG_TXT=" &middot; <span style=\"color:#f0883e;\">${FLAGGED} unusually large jump flagged</span>"; else FLAG_TXT=""; fi
          if [ "$Y_IS_YESTERDAY" -eq 1 ]; then Y_LABEL="Yesterday"; else Y_LABEL="Since last report"; fi
          if [ "$W_CHECKS_KNOWN" -eq 1 ]; then W_CHECKS_TXT="${W_CHECKS} update checks"; else W_CHECKS_TXT="update checks: not enough history yet"; fi
          GLANCE="<tr><td colspan=\"3\" style=\"padding:12px 14px;background:#161b22;border-radius:6px;color:#e6edf3;font-size:13px;line-height:1.7;\">
            <strong>${Y_LABEL}:</strong> ${Y_TOTAL} downloads (Windows ${Y_WIN} &middot; Mac ${Y_MAC})${FLAG_TXT}<br>
            <strong>Last 7 days:</strong> ${W_TOTAL} downloads (Windows ${W_WIN} &middot; Mac ${W_MAC}) &middot; ${W_CHECKS_TXT}
          </td></tr>
          <tr><td colspan=\"3\" style=\"padding:4px;border-bottom:none;\"></td></tr>"

          # Warning banner (fetch failures / stale feeds)
          WARN_BANNER=""
          if [ -n "$WARN_ITEMS" ]; then
            WARN_BANNER="<tr><td colspan=\"3\" style=\"padding:12px 14px;background:#f0883e22;border:1px solid #f0883e;border-radius:6px;color:#f0883e;font-size:13px;line-height:1.6;\">
              <strong>Some data is incomplete today</strong><br>${WARN_ITEMS}
            </td></tr>
            <tr><td colspan=\"3\" style=\"padding:4px;border-bottom:none;\"></td></tr>"
          fi

          # Token warning banner
          TOKEN_BANNER=""
          if [ "$TOKEN_WARNING" = "true" ]; then
            TOKEN_BANNER="<tr><td colspan=\"3\" style=\"padding:12px 14px;background:#f8514922;border:1px solid #f85149;border-radius:6px;color:#f85149;font-size:13px;\">
              <strong>Token Expiry Warning</strong><br>
              Your GH_STATS_TOKEN expires on ${TOKEN_EXPIRY_DATE} (${TOKEN_DAYS_LEFT} days remaining).<br>
              <a href=\"https://github.com/settings/tokens\" style=\"color:#58a6ff;\">Rotate token</a> then
              <a href=\"https://github.com/mrdavearms/repo-stats/settings/secrets/actions\" style=\"color:#58a6ff;\">update the secret</a>.
            </td></tr>
            <tr><td colspan=\"3\" style=\"padding:4px;border-bottom:none;\"></td></tr>"
          fi

          LEGEND="<tr><td colspan=\"3\" style=\"padding:14px 0 0 0;color:#6e7681;font-size:11px;line-height:1.6;\">
            <strong>Downloads</strong> count every fetch of an installer file (.exe, .msi, .dmg), not people: the same person twice, a Windows copy updating itself, and crawlers all count. GitHub keeps no unique-downloader figure and occasionally revises its counter down.
            <strong>Update checks</strong> are installed copies asking GitHub for a new version (usually once per launch), the best available sign that copies are in use. Only copies that fetch an updater file are counted: Doc Redactor and NAPLAN always have; Bulk PDF only from v2.17 (22 Sep 2026), so its figure grows as people update.
            <strong>Views</strong> and <strong>clones</strong> show the latest complete day GitHub has published; the feed lags 1&ndash;2 days. Most clones are automated.
            <strong>Where visitors came from</strong> is GitHub's referrer list for the last 14 days; GitHub does not publish visitor locations.
          </td></tr>"

          # Build full HTML email body
          HTML_BODY="<!DOCTYPE html><html><body style=\"margin:0;padding:0;background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;\"><table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" style=\"background:#0d1117;padding:20px;\"><tr><td align=\"center\"><table width=\"600\" cellpadding=\"0\" cellspacing=\"0\" style=\"background:#0d1117;\"><tr><td style=\"padding:0 0 16px 0;border-bottom:1px solid #30363d;\"><span style=\"font-size:20px;font-weight:600;color:#e6edf3;\">Repo Stats</span><span style=\"float:right;color:#8b949e;font-size:13px;line-height:28px;\">${DISPLAY_DATE}</span></td></tr><tr><td style=\"padding:8px;border-bottom:none;\"></td></tr>${WARN_BANNER}${TOKEN_BANNER}${GLANCE}${APP_CARDS}<tr><td colspan=\"3\" style=\"padding:16px 0 0 0;text-align:center;\"><a href=\"https://mrdavearms.github.io/repo-stats/\" style=\"display:inline-block;padding:8px 20px;background:#58a6ff;color:#fff;text-decoration:none;border-radius:6px;font-size:13px;font-weight:600;\">View Dashboard</a></td></tr>${LEGEND}</table></td></tr></table></body></html>"

          SUBJECT="Repo Stats ${DISPLAY_DATE} - ${Y_TOTAL} downloads $(echo "$Y_LABEL" | tr 'A-Z' 'a-z') (Windows ${Y_WIN}, Mac ${Y_MAC})"
          if [ "$FLAGGED" -gt 0 ]; then SUBJECT="${SUBJECT} - check for crawler"; fi
          if [ -n "$WARN_ITEMS" ]; then SUBJECT="${SUBJECT} - data incomplete"; fi

          # Assemble email with headers
          {
            printf 'From: Repo Stats <%s>\r\n' "$GMAIL_ADDRESS"
            printf 'To: %s\r\n' "$GMAIL_ADDRESS"
            printf 'Subject: %s\r\n' "$SUBJECT"
            printf 'MIME-Version: 1.0\r\n'
            printf 'Content-Type: text/html; charset=UTF-8\r\n'
            printf '\r\n'
            printf '%s' "$HTML_BODY"
          } > /tmp/email.txt

          # Send via Gmail SMTP
          curl -s --url "smtps://smtp.gmail.com:465" \
            --ssl-reqd \
            --mail-from "$GMAIL_ADDRESS" \
            --mail-rcpt "$GMAIL_ADDRESS" \
            --user "${GMAIL_ADDRESS}:${GMAIL_APP_PASSWORD}" \
            -T /tmp/email.txt

          echo "Email sent to $GMAIL_ADDRESS"
